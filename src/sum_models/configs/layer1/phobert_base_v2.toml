[data]
train_path = "sum_models/data/train.json"
validation_path = "sum_models/data/dev.json"
test_path = "sum_models/data/test.json"
id_field = "id"
context_field = "context"
question_field = "question"
answer_field = "response"
label_field = "label"

[model]
name = "phobert_base_v2_layer1"
checkpoint = "vinai/phobert-base-v2"
adapter = "sum_models.models.encoder:EncoderRuntime"
family = "encoder"
method = "finetune"

[model.params]
revision = "main"
overlap = 0.25
question_tokens = 64
answer_window_tokens = 64
attention = "sdpa"
quantize_4bit = false
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
max_new_tokens = 32
inference_max_length = 256
few_shot = 0
diagnosis_threshold = 0.5
task = "layer1"
model_key = "phobert"
vncorenlp_dir = "sum_models/resources/vncorenlp"

[training]
enabled = true
seed = 42
epochs = 5
learning_rate = 2e-05
train_batch_size = 1
eval_batch_size = 1
gradient_accumulation_steps = 16
max_length = 256
output_dir = "sum_models/outputs/layer1/phobert_base_v2"

[training.params]
weight_decay = 0.01
warmup_ratio = 0.06
max_grad_norm = 1.0
checkpoint_steps = 100
early_stopping_patience = 2
early_stopping_threshold = 0.0
resume_from_checkpoint = "auto"
gradient_checkpointing = true
precision = "auto"
device = "cuda"
require_smoke = true
bootstrap_iterations = 1000

[evaluation]
split = "validation"
batch_size = 1
save_predictions = true
