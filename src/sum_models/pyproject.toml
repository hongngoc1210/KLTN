[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sum-models"
version = "0.2.0"
description = "Vietnamese SUM hallucination models with a QA-compatible experiment interface"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "nbformat>=5.10"]

[project.optional-dependencies]
encoders = ["torch>=2.6,<3", "transformers==4.57.1", "sentencepiece>=0.2", "protobuf>=4", "accelerate>=1.10,<2", "py-vncorenlp>=0.1.4"]
llm = ["torch>=2.6,<3", "transformers>=5.5,<6", "peft>=0.18,<1", "accelerate>=1.10,<2", "bitsandbytes>=0.48,<1", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
sum-models = "sum_models.main:main"

[tool.setuptools]
packages = ["sum_models", "sum_models.src", "sum_models.models", "sum_models.prompts", "sum_models.configs", "sum_models.scripts"]

[tool.setuptools.package-dir]
sum_models = "."

[tool.setuptools.package-data]
sum_models = ["configs/layer*/*.toml", "notebooks/*.ipynb", "*.md", "requirements*.txt"]
