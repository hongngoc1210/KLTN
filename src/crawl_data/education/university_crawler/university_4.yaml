# Nguồn tuyển sinh bổ sung, không trùng với universities.yaml,
# university_2.yaml và university_3.yaml.
#
# Mục tiêu: thu thập thông báo, đề án, quy chế, phương thức,
# hướng dẫn đăng ký/xét tuyển và các tài liệu PDF/DOCX liên quan.
#
# Hai nguồn HANU và Học viện Tài chính dùng Playwright vì trang danh sách
# có nội dung/link được tải động. Cài thêm khi cần:
#   pip install playwright
#   python -m playwright install chromium

universities:
  # ============================================================
  # 1. TRƯỜNG ĐẠI HỌC CÔNG NGHIỆP HÀ NỘI
  # ============================================================
  - key: haui
    name: Trường Đại học Công nghiệp Hà Nội
    base_url: https://tuyensinh.haui.edu.vn
    start_urls:
      - https://tuyensinh.haui.edu.vn/tin-tuc
    id_prefix: education_haui
    renderer: requests

    # Bài chi tiết có dạng:
    # /tin-tuc/<slug>/<object-id-24-ky-tu-hex>
    detail_patterns:
      - '^https://tuyensinh\.haui\.edu\.vn/tin-tuc/[^/?#]+/[0-9a-f]{24}/?$'

    pagination_patterns:
      - '^https://tuyensinh\.haui\.edu\.vn/tin-tuc\?.*\bpage=\d+'
      - '^https://tuyensinh\.haui\.edu\.vn/tin-tuc/page/\d+/?$'

    exclude_patterns:
      - '/hoi-dap(?:$|[/?#])'
      - '/lien-he(?:$|[/?#])'
      - '/dang-ky(?:$|[/?#])'
      - '/tra-cuu(?:$|[/?#])'
      - '/login(?:$|[/?#])'

    list_link_selectors:
      - 'main'
      - '.news-list'
      - '.list-news'
      - '.posts'
      - '.content'
      - 'body'

    content_selectors:
      - '.news-detail'
      - '.detail-content'
      - '.article-content'
      - '.post-content'
      - '.content'
      - 'article'
      - 'main'

    attachment_patterns:
      - '/uploads/'
      - '/upload/'
      - '/files/'
      - '\.(pdf|docx?)(?:$|[?&#])'

    id_pattern: '/([0-9a-f]{24})/?$'
    prefer_attachments: true
    allow_html_fallback: true
    max_pages: 30
    max_docs: 900
    min_chars: 300

  # ============================================================
  # 2. HỌC VIỆN NGÂN HÀNG
  # ============================================================
  - key: hvnh
    name: Học viện Ngân hàng
    base_url: https://hvnh.edu.vn
    start_urls:
      - https://hvnh.edu.vn/hvnh/vi/thong-tin-tuyen-sinh
    id_prefix: education_hvnh
    renderer: requests

    detail_patterns:
      - '^https://hvnh\.edu\.vn/hvnh/vi/thong-tin-tuyen-sinh/[^?#]+-\d+\.html$'

    pagination_patterns:
      - '^https://hvnh\.edu\.vn/hvnh/vi/thong-tin-tuyen-sinh\?.*\b(?:page|trang|p)=\d+'
      - '^https://hvnh\.edu\.vn/hvnh/vi/thong-tin-tuyen-sinh/(?:page|trang)/\d+/?$'

    exclude_patterns:
      - '/tim-kiem'
      - '/search'
      - '/dang-nhap'
      - '/login'
      - '/lien-he'

    list_link_selectors:
      - 'main'
      - '.news-list'
      - '.list-news'
      - '.content'
      - '#content'
      - 'body'

    content_selectors:
      - '.news-detail'
      - '.detail-content'
      - '.article-content'
      - '.content-detail'
      - '.content'
      - 'article'
      - 'main'

    attachment_patterns:
      - '/uploads/'
      - '/upload/'
      - '/files/'
      - '/FileUpload/'
      - '\.(pdf|docx?)(?:$|[?&#])'

    id_pattern: '-(\d+)\.html$'
    prefer_attachments: true
    allow_html_fallback: true
    max_pages: 30
    max_docs: 900
    min_chars: 300

