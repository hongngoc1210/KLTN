    base_url: https://tuyensinh.hlu.edu.vn
    start_urls:
      # Chuyên mục thông tin tuyển sinh đại học.
      - https://tuyensinh.hlu.edu.vn/TsNews/GetAllNewsByCat/7889
    id_prefix: education_hlu
    renderer: requests

    detail_patterns:
      - '^https://tuyensinh\.hlu\.edu\.vn/tsnews/details/\d+/?$'

    pagination_patterns:
      - '^https://tuyensinh\.hlu\.edu\.vn/TsNews/GetAllNewsByCat/7889\?.*\b(?:page|p)=\d+'
      - '^https://tuyensinh\.hlu\.edu\.vn/TsNews/GetAllNewsByCat/7889/(?:page/)?\d+/?$'

    exclude_patterns:
      - '/Account/'
      - '/Login'
      - '/Search'
      - '/LienHe'

    list_link_selectors:
      - 'main'
      - '.news-list'
      - '.list-news'
      - '.tab-content'
      - '.content'
      - '#content'
      - 'body'

    content_selectors:
      - '.news-detail'
      - '.detail-news'
      - '.detail-content'
      - '.article-content'
      - '.box-content'
      - '.content'
      - 'article'
      - 'main'

    attachment_patterns:
      - '/uploads/'
      - '/upload/'
      - '/files/'
      - '/FileUpload/'
      - '\.(pdf|docx?)(?:$|[?&#])'

    id_pattern: '/details/(\d+)/?$'
    prefer_attachments: true
    allow_html_fallback: true
    max_pages: 30
    max_docs: 900
    min_chars: 300

