_defaults: &defaults
  renderer: requests
  pagination_patterns:
    - '(?:[?&](?:page|paged|trang|Page|PageIndex)=\d+)'
    - '/(?:page|trang)/\d+/?(?:\?.*)?$'
  exclude_patterns:
    - '/wp-admin(?:/|$)'
    - '/wp-login'
    - '/wp-json/'
    - '/login(?:/|$)'
    - '/dang-nhap(?:/|$)'
    - '/search(?:/|$)'
    - '/tim-kiem(?:/|$)'
    - '/lien-he(?:/|$)'
    - '/contact(?:/|$)'
    - '/tag/'
    - '/author/'
    - '/feed(?:/|$)'
    - '/nganh-dao-tao(?:/|$)'
    - '/chuong-trinh-dao-tao(?:/|$)'
    - '/gioi-thieu(?:/|$)'
  list_link_selectors:
    - 'main'
    - '#content'
    - '.content'
    - '.site-content'
    - '.news-list'
    - '.list-news'
    - '.posts'
    - '.post-list'
    - '.article-list'
    - '.view-content'
    - '.elementor-posts-container'
    - 'body'
  content_selectors:
    - '.news-detail'
    - '.detail-content'
    - '.content-detail'
    - '.article-content'
    - '.post-content'
    - '.entry-content'
    - '.single-content'
    - '.elementor-widget-theme-post-content'
    - '.field-name-body'
    - 'article'
    - 'main'
  remove_selectors:
    - '.related-news'
    - '.related-posts'
    - '.share'
    - '.social-share'
    - '.sidebar'
    - '.comments'
  attachment_patterns:
    - '/uploads/'
    - '/upload/'
    - '/files/'
    - '/FileUpload/'
    - '/wp-content/uploads/'
    - '/documents/'
    - '/media/'
    - '\.(pdf|docx?)(?:$|[?&#])'
  prefer_attachments: true
  allow_html_fallback: true
  max_pages: 20
  max_docs: 500
  min_chars: 300
  enabled: true

universities:
  # 1. Trường Đại học Ngoại ngữ - ĐHQGHN
  - <<: *defaults
    key: ulis_vnu
    name: Trường Đại học Ngoại ngữ - ĐHQGHN
    base_url: https://ulis.vnu.edu.vn
    start_urls:
      - https://ulis.vnu.edu.vn/tuyensinh2026/
    id_prefix: education_ulis_vnu
    detail_patterns:
      - '^https://ulis\.vnu\.edu\.vn/[^?#]*(?:tuyen-sinh|tuyensinh|xet-tuyen|xettuyen|quy-che|de-an|thong-bao|phuong-thuc|diem-chuan|diem-san|nguong|nhap-hoc|nguyen-vong|nang-khieu|hoc-ba)[^?#]*(?:\?.*)?$'

  # 2. Trường Đại học Kinh tế - ĐHQGHN
  - <<: *defaults
    key: ueb_vnu
    name: Trường Đại học Kinh tế - ĐHQGHN
    base_url: https://ueb.edu.vn
    start_urls:
      - https://ueb.edu.vn/Tuyen-Sinh/UEB/thong-tin-tuyen-sinh/1730/1731/1737
    id_prefix: education_ueb_vnu
    detail_patterns:
      - '^https://ueb\.edu\.vn/(?:Tuyen-Sinh|Tin-Tuc)/UEB/[^?#]+(?:\?.*)?$'

  # 3. Trường Đại học Mỏ - Địa chất
