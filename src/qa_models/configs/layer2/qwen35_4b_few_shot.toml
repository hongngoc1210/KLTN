[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "qwen35_4b_layer2_few_shot"
checkpoint = "Qwen/Qwen3.5-4B"
adapter = "qa_models.models.qwen35_4b_few_shot_layer2:Qwen35Layer2FewShotAdapter"
family = "generative_llm"
method = "few_shot"

[model.params]
task = "layer2"
trust_remote_code = false
device_map = "auto"
dtype = "float16"
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "float16"
max_input_length = 8192
max_new_tokens = 512
iou_match_threshold = 0.5
shots_per_type = 1
few_shot_seed = 42
few_shot_max_demo_chars = 1200
hf_token_env = "HF_TOKEN"
require_hf_token = false

[training]
enabled = false
seed = 42
epochs = 0
learning_rate = 0.0
train_batch_size = 1
eval_batch_size = 1
gradient_accumulation_steps = 1
max_length = 8192
output_dir = "qa_models/outputs/layer2/qwen35_4b_few_shot"

[training.params]

[evaluation]
split = "test"
batch_size = 1
save_predictions = true
