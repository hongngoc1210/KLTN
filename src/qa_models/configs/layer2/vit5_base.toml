[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "vit5_base_layer2"
checkpoint = "VietAI/vit5-base"
adapter = "qa_models.models.vit5_base_layer2:ViT5BaseLayer2Adapter"
family = "seq2seq"
method = "finetune"

[model.params]
task = "layer2"
max_target_length = 512
iou_match_threshold = 0.5
relaxed_iou_threshold = 0.3
hf_token_env = "HF_TOKEN"
require_hf_token = false

[training]
enabled = true
seed = 42
epochs = 10
learning_rate = 0.00005
train_batch_size = 4
eval_batch_size = 8
gradient_accumulation_steps = 4
max_length = 512
# Fresh namespace: full-dev extraction F1; old checkpoint history is separate.
output_dir = "qa_models/outputs/layer2/vit5_base_extraction_f1"

[training.params]
weight_decay = 0.01
warmup_steps = 150
logging_steps = 50
save_total_limit = 3
early_stopping_patience = 2
early_stopping_threshold = 0.0001
resume_from_checkpoint = "auto"
fp16 = false
bf16 = false

[evaluation]
split = "test"
batch_size = 8
save_predictions = true
