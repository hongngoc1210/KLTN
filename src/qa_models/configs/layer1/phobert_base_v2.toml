[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "phobert_base_v2_layer1"
checkpoint = "vinai/phobert-base-v2"
adapter = "qa_models.models.phobert_base:PhoBERTBaseV2Adapter"
family = "encoder_classifier"
method = "finetune"

[model.params]
trust_remote_code = false
use_fast = false
truncation = "only_second"
vncorenlp_dir = "qa_models/resources/vncorenlp"
hf_token_env = "HF_TOKEN"
require_hf_token = false

[training]
enabled = true
seed = 42
epochs = 10
learning_rate = 0.00002
train_batch_size = 16
eval_batch_size = 32
gradient_accumulation_steps = 1
max_length = 256
output_dir = "qa_models/outputs/layer1/phobert_base_v2"

[training.params]
weight_decay = 0.01
warmup_steps = 150
logging_steps = 50
save_total_limit = 3
early_stopping_patience = 2
early_stopping_threshold = 0.0001
resume_from_checkpoint = "auto"
fp16 = false
bf16 = false

[evaluation]
split = "test"
batch_size = 32
save_predictions = true
