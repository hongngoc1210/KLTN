[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "gemma4_e4b_layer1_few_shot"
checkpoint = "google/gemma-4-E4B-it"
adapter = "qa_models.models.gemma4_e4b_few_shot:Gemma4E4BFewShotAdapter"
family = "generative_llm"
method = "few_shot"

[model.params]
trust_remote_code = false
device_map = "auto"
dtype = "float16"
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "float16"
max_input_length = 4096
max_new_tokens = 32
parse_failure_fallback = "no_hallucination"
shots_per_label = 1
few_shot_seed = 42
hf_token_env = "HF_TOKEN"
require_hf_token = false

[training]
enabled = false
seed = 42
epochs = 0
learning_rate = 0.0
train_batch_size = 1
eval_batch_size = 1
gradient_accumulation_steps = 1
max_length = 4096
output_dir = "qa_models/outputs/layer1/gemma4_e4b_few_shot"

[training.params]

[evaluation]
split = "test"
batch_size = 1
save_predictions = true
