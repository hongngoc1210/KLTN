[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "mdeberta_v3_base_layer1"
checkpoint = "microsoft/mdeberta-v3-base"
adapter = "qa_models.models.mdeberta_v3_base:MDeBERTaV3BaseAdapter"
family = "encoder_classifier"
method = "finetune"

[model.params]
trust_remote_code = false
use_fast = false
# Một số question + answer vượt 256 token theo tokenizer mDeBERTa.
# longest_first cho phép cắt cả hai vế khi context không đủ để cắt tiếp.
truncation = "longest_first"
hf_token_env = "HF_TOKEN"
require_hf_token = false

[training]
enabled = true
seed = 42
epochs = 10
learning_rate = 0.00002
train_batch_size = 8
eval_batch_size = 16
gradient_accumulation_steps = 2
max_length = 256
output_dir = "qa_models/outputs/layer1/mdeberta_v3_base"

[training.params]
weight_decay = 0.01
warmup_steps = 150
logging_steps = 50
save_total_limit = 3
early_stopping_patience = 2
early_stopping_threshold = 0.0001
resume_from_checkpoint = "auto"
fp16 = false
bf16 = false

[evaluation]
split = "test"
batch_size = 16
save_predictions = true
