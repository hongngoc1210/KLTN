[data]
train_path = "qa_models/data/train.json"
validation_path = "qa_models/data/dev.json"
test_path = "qa_models/data/test.json"
id_field = "qa_id"
context_field = "content"
question_field = "question"
answer_field = "answer"
label_field = "label"

[model]
name = "mmbert_base_layer4_repair_action"
checkpoint = "jhu-clsp/mmBERT-base"
adapter = "qa_models.tasks.layer4.encoder_adapter:EncoderLayer4Adapter"
family = "encoder_classifier"
method = "finetune"

[model.params]
task = "layer4"
trust_remote_code = false
hf_token_env = "HF_TOKEN"
require_hf_token = false
use_fast = true

[training]
enabled = true
seed = 42
epochs = 10
learning_rate = 0.00002
train_batch_size = 4
eval_batch_size = 8
gradient_accumulation_steps = 4
max_length = 512
output_dir = "qa_models/outputs/layer4/mmbert_base"

[training.params]
weight_decay = 0.01
warmup_steps = 150
logging_steps = 50
save_total_limit = 3
early_stopping_patience = 2
early_stopping_threshold = 0.0001
resume_from_checkpoint = "auto"
gradient_checkpointing = false
fp16 = false
bf16 = false

[evaluation]
split = "test"
batch_size = 8
save_predictions = true
